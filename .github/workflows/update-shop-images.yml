name: Update shop images

on:
  push:
    branches:
      - main
    paths:
      - "assets/images/shop/**"

permissions:
  contents: write

jobs:
  update-shop-images:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: shop-images.json genereren
        run: node scripts/generate-shop-images.js

      - name: Controleren of shop-images.json is gewijzigd
        id: changes
        run: |
          if git diff --quiet shop-images.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nieuwe shop-images.json committen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop-images.json
          git commit -m "Automatisch shop-images.json bijwerken"
          git push