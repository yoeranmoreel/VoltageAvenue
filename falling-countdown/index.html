<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b10">
<meta name="description" content="FALLING by Voltage Avenue. November 20, 2026. Watch the live countdown and get a release reminder.">
<meta property="og:type" content="website">
<meta property="og:title" content="FALLING — Voltage Avenue">
<meta property="og:description" content="The countdown is on. November 20, 2026.">

<meta property="og:image:alt" content="Original Falling single artwork by Voltage Avenue">
<title>FALLING — Voltage Avenue | Live Countdown</title>
<style>
:root{color-scheme:dark;--gold:#ffb36a;--paper:#f6f4ef;--black:#0b0b10;font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
html{background:var(--black)}
body{margin:0;min-height:100svh;color:var(--paper);overflow-x:hidden;background:radial-gradient(ellipse at 50% 34%,#4a2925 0%,#1c171b 34%,#0b0b10 78%)}
a:focus-visible{outline:3px solid #ffd5a4;outline-offset:5px}
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;isolation:isolate}
.scene::before{content:"";position:absolute;inset:-22%;background:url("../assets/images/falling-artwork.jpeg") center/cover no-repeat;filter:blur(75px) brightness(.20) saturate(.9);opacity:.65;transform:scale(1.13)}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b0b1060,transparent 25%,#0b0b1045 65%,#0b0b10d9)}
.aura{position:absolute;left:50%;top:39%;width:min(110vw,1050px);height:min(100vw,940px);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,#ffad4f30 0%,#e06d3021 29%,transparent 65%);filter:blur(28px);animation:auraPulse 11s ease-in-out infinite alternate}
.arc{position:absolute;width:105vw;height:105vw;max-width:1450px;max-height:1450px;border:2px solid #ffa65b32;border-radius:50%;transform:rotate(-25deg);box-shadow:0 0 22px #f2a25a18}
.arc-one{left:-64vw;top:-53vw}
.arc-two{right:-79vw;bottom:-78vw;border-color:#e992452c}
.beam{position:absolute;width:45vw;height:130vh;top:-15vh;opacity:.26;filter:blur(26px);background:linear-gradient(90deg,transparent 25%,#ffb96a18 48%,transparent 70%);transform:rotate(23deg);animation:beamDrift 18s ease-in-out infinite alternate}
.beam-left{left:-17vw}.beam-right{right:-22vw;transform:rotate(-24deg);animation-delay:-9s}
.specks{position:absolute;inset:0}
.speck{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#ffc185;box-shadow:0 0 8px 2px #ffa4537d;opacity:var(--o);animation:floatUp var(--t) ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes floatUp{from{transform:translate3d(0,9px,0);opacity:.12}to{transform:translate3d(10px,-21px,0);opacity:var(--o)}}
@keyframes auraPulse{from{opacity:.65;transform:translate(-50%,-50%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}
@keyframes beamDrift{from{translate:-4% 0;opacity:.14}to{translate:6% 0;opacity:.35}}
.page{position:relative;z-index:1;min-height:100svh;width:min(100%,1100px);margin:auto;padding:20px 22px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stage{width:100%;display:flex;flex-direction:column;align-items:center}
.art-shell{position:relative;width:min(100%,620px,calc(100svh - 275px));aspect-ratio:1;flex:none;isolation:isolate}
.art-shell::before{content:"";position:absolute;inset:-14px;z-index:-1;background:conic-gradient(from 25deg,#ffb56a00,#ffa84f65,#ffb56a00,#ffb56a65,#ffb56a00);filter:blur(20px);opacity:.7;animation:haloTurn 24s linear infinite}
.art-shell::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 0 1px #fff8,inset 0 0 24px #fcb56a18,0 0 1px 1px #f7a65560}
.art-mask{position:absolute;inset:0;overflow:hidden;background:#ddd;box-shadow:0 20px 65px #000c}
.artwork{display:block;width:100%;height:100%;object-fit:cover;animation:artFloat 21s ease-in-out infinite alternate;will-change:transform}
.art-shine{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(112deg,transparent 17%,#ffbd7223 29%,transparent 41%,transparent 70%,#ffcb861c 86%,transparent);mix-blend-mode:screen;animation:shine 15s ease-in-out infinite alternate}
@keyframes artFloat{0%{transform:scale(1.015) translate(-.3%,.2%)}50%{transform:scale(1.055) translate(1%,-.4%)}100%{transform:scale(1.095) translate(-.8%,.7%)}}
@keyframes shine{from{opacity:.3;transform:translateX(-9%)}to{opacity:.8;transform:translateX(9%)}}
@keyframes haloTurn{to{transform:rotate(360deg)}}
.release{position:relative;z-index:5;width:min(94%,560px);margin-top:-94px;text-align:center}
.count-panel{border:1px solid #fff7;border-radius:18px;padding:18px 18px 16px;background:linear-gradient(125deg,#19171a9c,#09090dc2);-webkit-backdrop-filter:blur(17px) saturate(1.15);backdrop-filter:blur(17px) saturate(1.15);box-shadow:0 18px 48px #0009,inset 0 1px #ffffff54}
.count-kicker{display:flex;align-items:center;gap:14px;justify-content:center;margin:0 0 14px;color:var(--gold);font-weight:900;font-size:.73rem;letter-spacing:.32em;white-space:nowrap}
.count-kicker::before,.count-kicker::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#ffbb8075)}
.count-kicker::after{transform:rotate(180deg)}
.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.unit{position:relative;padding:0 5px;text-align:center}
.unit:not(:last-child)::after{content:"";position:absolute;right:0;top:14%;height:69%;width:1px;background:#ffffff36}
.num{font-weight:900;font-size:clamp(1.9rem,4vw,3.1rem);line-height:1.15;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px #000a}
.label{font-size:.65rem;font-weight:800;letter-spacing:.19em;color:#e5dddb;margin-top:7px}
.actions{margin-top:25px}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:56px;min-width:250px;padding:16px 26px;background:linear-gradient(110deg,#ffac60,#ffbd79);color:#1a1110;font-size:.9rem;letter-spacing:.14em;font-weight:900;text-decoration:none;border-radius:4px;box-shadow:0 0 30px #ffae644d,0 8px 25px #0006;transition:transform .2s,box-shadow .2s}
.button:hover{transform:translateY(-3px);box-shadow:0 0 45px #ffae6480,0 10px 25px #0007}
.small{font-size:.78rem;line-height:1.6;letter-spacing:.045em;color:#e3d6d1;margin:18px auto 0;max-width:390px}
.out{display:none}
.released .before{display:none}
.released .out{display:block}
.out-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:900;letter-spacing:.13em;color:var(--gold)}
.footer{width:min(100%,620px);display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;border-top:1px solid #ffffff2b;margin-top:28px;padding-top:16px;font-size:.65rem;letter-spacing:.14em;color:#bcb5b5}
.footer a{color:#eae4e0;text-decoration:none}
@media(max-width:750px){
.page{justify-content:flex-start;padding:12px 14px 26px}
.art-shell{width:min(100%,470px);margin:0 auto}
.release{width:min(100%,470px);margin-top:-70px}
.count-panel{padding:14px 10px 13px;border-radius:15px}
.count-kicker{font-size:.61rem;letter-spacing:.23em;gap:9px;margin-bottom:10px}
.num{font-size:clamp(1.6rem,7.2vw,2.55rem)}
.label{font-size:.55rem;letter-spacing:.12em;margin-top:5px}
.actions{margin-top:22px}
.button{min-height:52px;min-width:min(72%,260px);font-size:.8rem}
.small{font-size:.73rem;margin-top:13px}
.footer{width:min(100%,470px);margin-top:25px}
.arc-one{left:-85vw;top:-60vw}
.arc-two{right:-105vw;bottom:-65vw}
}
@media(max-width:380px){
.page{padding-inline:10px}
.release{margin-top:-59px}
.count-panel{padding:11px 7px}
.num{font-size:1.55rem}
.footer{font-size:.55rem}
}
@media(max-height:740px) and (min-width:751px){
.art-shell{width:min(100%,calc(100svh - 235px),530px)}
.release{margin-top:-82px}
.count-panel{padding:12px 16px}
.actions{margin-top:16px}
.small{margin-top:10px}
.footer{margin-top:16px}
}
@media(prefers-reduced-motion:reduce){
.artwork,.art-shine,.art-shell::before,.aura,.beam,.speck{animation:none!important}
.button{transition:none}
}

/* FALLING — THE RELEASE EVENT */
body{background:radial-gradient(ellipse at 50% 30%,#693c2a 0%,#30201e 28%,#110f15 65%,#07070b 100%)}
.scene::before{filter:blur(52px) brightness(.34) saturate(1.35);opacity:.85;animation:backdropBreath 14s ease-in-out infinite alternate}
.scene::after{background:radial-gradient(ellipse at 50% 38%,transparent 13%,#0b0b1040 57%,#08080bb8 100%)}
.aura{background:radial-gradient(ellipse,#ffb15a70 0%,#e86d3c44 26%,#f9a15319 48%,transparent 70%);filter:blur(40px);animation:auraPulse 7s ease-in-out infinite alternate}
.arc{border-width:3px;border-color:#ffad6580;box-shadow:0 0 15px #ff99485a,inset 0 0 22px #ff994827;animation:orbitGlow 15s ease-in-out infinite alternate}
.arc-two{border-color:#ff994f66;animation-delay:-8s}
.beam{width:55vw;opacity:.6;filter:blur(14px);background:linear-gradient(90deg,transparent 0%,#ffb45c05 27%,#ffad5c58 49%,#ffc87815 52%,transparent 80%);animation:beamDrift 10s ease-in-out infinite alternate}
.beam-left{left:-8vw}.beam-right{right:-10vw}
.art-shell::before{inset:-32px;background:conic-gradient(from 20deg,#ffae6200,#ffae628c,#ffae6200,#ffca7e88,#ffae6200);filter:blur(30px);opacity:1;animation:haloTurn 19s linear infinite}
.art-shell::after{box-shadow:inset 0 0 0 1px #ffe0aa,0 0 6px #ffc075c7,0 0 35px #ff964d99,0 0 90px #f67b4266}
.art-shine{background:linear-gradient(105deg,transparent 20%,#fff1c514 28%,transparent 35%,transparent 65%,#ffbb692c 81%,transparent 92%);animation:shine 9s ease-in-out infinite alternate}
.count-panel{border:1px solid #ffd8ac91;background:linear-gradient(125deg,#1b1517b3,#08080dc9);box-shadow:0 16px 50px #000c,0 0 30px #f9a65b48,inset 0 1px #ffe5c17d}
.button{background:linear-gradient(115deg,#ffa44c,#ffcf86,#ffab58);background-size:220% 100%;animation:buttonGlow 4s ease-in-out infinite alternate;box-shadow:0 0 28px #ffa45d99,0 0 65px #ff924345,0 10px 25px #0009}
.speck{box-shadow:0 0 10px 3px #ffb466bd;animation:floatUp var(--t) ease-in-out infinite alternate,emberBlink 3.5s ease-in-out infinite alternate}
@keyframes backdropBreath{from{transform:scale(1.13) rotate(-2deg);opacity:.62}to{transform:scale(1.24) rotate(2deg);opacity:.92}}
@keyframes orbitGlow{from{opacity:.32;filter:blur(1px)}to{opacity:.95;filter:blur(0)}}
@keyframes buttonGlow{from{background-position:0% 50%;box-shadow:0 0 20px #ffa45d80,0 0 42px #ff92432e}to{background-position:100% 50%;box-shadow:0 0 40px #ffa45dca,0 0 85px #ff92436e}}
@keyframes emberBlink{0%,100%{filter:brightness(.6)}50%{filter:brightness(2.2)}}
.light-burst{position:absolute;z-index:0;left:50%;top:36%;width:min(110vw,1100px);height:min(110vw,1100px);transform:translate(-50%,-50%);background:repeating-conic-gradient(from 12deg,#ffb15c00 0deg,#ffb15c0a 2deg,#ffb15c00 7deg,#ffb15c00 22deg);mask-image:radial-gradient(circle,transparent 16%,black 38%,transparent 69%);opacity:.9;animation:burstTurn 65s linear infinite}
@keyframes burstTurn{to{transform:translate(-50%,-50%) rotate(360deg)}}
.light-streak{position:absolute;height:2px;width:38vw;max-width:500px;background:linear-gradient(90deg,transparent,#ffba72a6,#fff1c5,transparent);box-shadow:0 0 12px #ff9e52,0 0 26px #ff9e5266;opacity:.65;transform:rotate(-27deg);animation:streakFloat 9s ease-in-out infinite alternate}
.streak-one{top:22%;left:-13%}.streak-two{bottom:24%;right:-14%;transform:rotate(-27deg);animation-delay:-5s}
@keyframes streakFloat{from{opacity:.2;translate:-30px 25px}to{opacity:.85;translate:35px -25px}}
@media(max-width:750px){
.aura{top:30%;width:140vw;height:140vw}
.light-burst{top:25%;width:170vw;height:170vw}
.arc-one{left:-92vw;top:-70vw}.arc-two{right:-125vw;bottom:-80vw}
.light-streak{width:50vw}
.art-shell::before{inset:-19px;filter:blur(22px)}
}
@media(prefers-reduced-motion:reduce){
.scene::before,.arc,.light-burst,.light-streak,.button,.speck{animation:none!important}
}

/* FOREGROUND ATMOSPHERE — LIGHT AND EMBERS IN FRONT OF THE ART */
.art-atmosphere{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;isolation:isolate}
.art-atmosphere::before{content:"";position:absolute;inset:-30%;background:linear-gradient(115deg,transparent 27%,#ffd59a00 37%,#ffbb7340 47%,#fff0ce23 49%,#ffb86c00 58%,transparent 70%);mix-blend-mode:screen;filter:blur(14px);animation:foregroundSweep 11s ease-in-out infinite alternate}
.art-atmosphere::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 3% 72%,#ff9e465c,transparent 37%),radial-gradient(ellipse at 97% 19%,#ffbc6454,transparent 34%);mix-blend-mode:screen;filter:blur(18px);animation:foregroundGlow 7s ease-in-out infinite alternate}
.art-ember{position:absolute;z-index:2;left:var(--x);top:var(--y);width:var(--size);height:var(--size);border-radius:50%;background:#ffdfab;box-shadow:0 0 8px 3px #ffa85d,0 0 20px #ff9b49;opacity:.7;animation:emberAcross var(--duration) ease-in-out infinite alternate;animation-delay:var(--delay)}
@keyframes foregroundSweep{from{transform:translateX(-33%) rotate(-5deg);opacity:.24}to{transform:translateX(30%) rotate(4deg);opacity:.85}}
@keyframes foregroundGlow{from{opacity:.3}to{opacity:.95}}
@keyframes emberAcross{from{transform:translate(-9px,15px) scale(.65);opacity:.12}to{transform:translate(13px,-22px) scale(1.2);opacity:.85}}
@media(max-width:750px){.art-atmosphere::before{filter:blur(10px)}.art-atmosphere::after{filter:blur(13px)}}
@media(prefers-reduced-motion:reduce){.art-atmosphere::before,.art-atmosphere::after,.art-ember{animation:none!important}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true">

<div class="beam beam-left"></div><div class="beam beam-right"></div>
<div class="specks">
<span class="speck" style="--x:6%;--y:17%;--s:2px;--o:.55;--t:8s;--d:-2s"></span>
<span class="speck" style="--x:12%;--y:70%;--s:3px;--o:.7;--t:11s;--d:-6s"></span>

<span class="speck" style="--x:31%;--y:13%;--s:2px;--o:.5;--t:13s;--d:-7s"></span>

</div>
<main class="page" id="page">

<div class="art-shell">
<div class="art-mask">
<img class="artwork" src="../assets/images/falling-artwork.jpeg" alt="Falling — original Voltage Avenue single artwork" width="1200" height="1200" fetchpriority="high">

<section class="release" aria-label="Falling release countdown">

<div class="actions out"><a class="button" href="https://open.spotify.com/search/Voltage%20Avenue%20Falling" target="_blank" rel="noopener noreferrer">LISTEN ON SPOTIFY ↗</a></div>
</section>
</div>
<footer class="footer"><span>© VOLTAGE AVENUE</span><a href="../">BACK TO WEBSITE ↗</a></footer>
</main>
<script>
const release=Date.parse("2026-11-20T00:00:00+01:00");
const page=document.getElementById("page");
const els=["days","hours","minutes","seconds"].map(id=>document.getElementById(id));
function tick(){
const delta=Math.max(0,Math.ceil((release-Date.now())/1000));
if(delta===0){page.classList.add("released");return}
page.classList.remove("released");
const values=[Math.floor(delta/86400),Math.floor(delta/3600)%24,Math.floor(delta/60)%60,delta%60];
values.forEach((value,index)=>els[index].textContent=String(value).padStart(2,"0"));
}
tick();
setInterval(tick,1000);
document.addEventListener("visibilitychange",tick);
</script>
